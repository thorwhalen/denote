[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "denote"
version = "0.0.2"
description = "Portal and facade for audio-to-symbol tools (MIDI, chords, pitch from audio)"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = []
authors = [
    { name = "Thor Whalen" },
]
dependencies = [
    "numpy",
    "librosa>=0.10",
]

[project.urls]
Homepage = "https://github.com/thorwhalen/denote"
Repository = "https://github.com/thorwhalen/denote"
Documentation = "https://thorwhalen.github.io/denote"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "soundfile>=0.12",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]
basic_pitch = ["basic-pitch>=0.3"]
torchcrepe = ["torchcrepe>=0.0.20"]
pesto = ["pesto-pitch"]
madmom = ["madmom"]
autochord = ["autochord"]
beat_this = ["beat_this"]
demucs = ["demucs>=4.0"]
pretty_midi = ["pretty-midi>=0.2.10"]
all = [
    "basic-pitch>=0.3",
    "torchcrepe>=0.0.20",
    "pesto-pitch",
    "pretty-midi>=0.2.10",
    "demucs>=4.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
